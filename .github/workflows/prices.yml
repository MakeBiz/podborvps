name: Мониторинг цен

on:
  schedule:
    - cron: '0 4 * * *'      # каждый день в 07:00 по Москве
  workflow_dispatch:          # плюс кнопка ручного запуска

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Поставить зависимости
        run: npm install --omit=dev

      - name: Собрать цены
        id: collect
        continue-on-error: true
        env:
          TIMEWEB_TOKEN:        ${{ secrets.TIMEWEB_TOKEN }}
          VDSINA_TOKEN:         ${{ secrets.VDSINA_TOKEN }}
          REGRU_CLOUDVPS_TOKEN: ${{ secrets.REGRU_CLOUDVPS_TOKEN }}
          RUVDS_KEY:            ${{ secrets.RUVDS_KEY }}
          RUVDS_USER:           ${{ secrets.RUVDS_USER }}
          RUVDS_PASS:           ${{ secrets.RUVDS_PASS }}
          HOSTMAN_TOKEN:        ${{ secrets.HOSTMAN_TOKEN }}
          DATAPACKET_TOKEN:     ${{ secrets.DATAPACKET_TOKEN }}
          FX_RATES:             ${{ vars.FX_RATES }}
        run: node run.js | tee run.log

      - name: Сохранить снимок в репозиторий
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "price-monitor"
          git config user.email "bot@podborvps"
          git add monitor/data/
          git diff --staged --quiet || git commit -m "цены на $(date -u +%F)"
          git push

      - name: Завести задачу, если источник сломался
        if: steps.collect.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'см. лог запуска';
            try { log = (fs.readFileSync('monitor/run.log','utf8').split('ПРОБЛЕМНЫЕ ИСТОЧНИКИ:')[1] || log).slice(0, 3000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Мониторинг цен: сбой ${new Date().toISOString().slice(0,10)}`,
              body: 'Часть источников не отдала данные. На витрине остались прошлые цены, через 7 дней они пометятся устаревшими и скроются.\n\n```\n' + log + '\n```',
              labels: ['мониторинг']
            });
