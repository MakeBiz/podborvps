nt-weight:700;font-size:14.5px;line-height:1;color:#fff;padding:12px 19px;border-radius:13px;border:1px solid #0B44B8;background:linear-gradient(180deg,#3D85FF 0%,#0F58EC 48%,#0A47CC 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.22),0 1px 2px rgba(3,35,95,.25),0 8px 18px -6px rgba(7,78,232,.5);transition:.16s" data-h="h6"><span class="s9"></span><span style="position:relative">Перейти</span><span class="s6">→</span></a></div></div></sc-for></div></section><section id="promo" class="s37"><div class="s3">Акции</div><h2 class="s16">Акции и промокоды</h2><p class="s27">Действующие скидки и промокоды наших партнёров. Скидка активируется по кнопке или промокодом при заказе.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px"><sc-for list="{{ promos }}" as="a"><div style="position:relative;display:flex;flex-direction:column;padding:24px;border-radius:24px;background:linear-gradient(180deg,#FFFFFF,#F4FBF7);border:1px solid #C7E9D5;box-shadow:inset 0 1px 0 #fff,0 18px 36px -22px rgba(10,125,70,.4)"><div style="display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:'Golos Text',sans-serif;font-size:11.5px;font-weight:700;color:#fff;padding:6px 12px;border-radius:10px;margin-bottom:16px;background:linear-gradient(180deg,#22C36A,#0F9D53);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -5px rgba(16,157,83,.5)">🎁 Акция</div><div style="display:flex;align-items:center;gap:13px;margin-bottom:13px"><div style="position:relative;flex:0 0 46px;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-family:'Onest',sans-serif;font-weight:800;color:#fff;font-size:18px;background:{{ a.logoBg }};box-shadow:{{ a.logoSh }}"><span style="position:relative">{{ a.letter }}</span></div><h3 style="font-family:'Onest',sans-serif;font-size:18.5px;font-weight:700;letter-spacing:-.4px;margin:0">{{ a.provider }}</h3></div><p style="font-family:'Onest',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.4px;color:#0A7D46;margin:0 0 12px;text-wrap:pretty">{{ a.benefit }}</p><sc-if value="{{ a.hasCode }}"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px"><span style="font-family:monospace;font-size:15px;font-weight:800;letter-spacing:.5px;color:#0A7D46;background:#E7F8EF;border:1px dashed #86D8A9;border-radius:10px;padding:9px 14px">{{ a.code }}</span><button type="button" onclick="try{navigator.clipboard&&navigator.clipboard.writeText('{{ a.code }}').catch(function(){})}catch(e){}this.textContent='Скопировано ✓'" style="font-family:'Onest',sans-serif;font-size:13px;font-weight:700;color:#0A7D46;background:#fff;border:1px solid #B8E6CC;border-radius:10px;padding:9px 14px;cursor:pointer">Копировать</button></div></sc-if><sc-if value="{{ a.cond }}"><p style="font-size:12px;color:#5E7A6B;margin:0 0 16px;text-wrap:pretty">{{ a.cond }}</p></sc-if><a href="{{ a.link }}" target="_blank" rel="sponsored nofollow noopener" sc-camel-on-click="{{ a.track }}" style="margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:'Onest',sans-serif;font-weight:700;font-size:14.5px;line-height:1;color:#fff;padding:13px 20px;border-radius:13px;border:1px solid #0B7A43;background:linear-gradient(180deg,#22C36A,#0F9D53);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px -6px rgba(16,157,83,.5)">Забрать скидку<span>→</span></a></div></sc-for></div></section><section id="how" class="s37"><div class="s3">Технология</div><h2 class="s16">Как это работает</h2><p class="s27">Коротко про технологию: почему один VPS закрывает почти любую задачу и что стоит учесть до заказа</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px"><div class="s10" data-h="h8"><div style="position:relative;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;background:linear-gradient(180deg,#3D85FF,#0A47CC);border:1px solid #0B44B8;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -8px rgba(7,78,232,.7)"><span class="s11"></span><span style="position:relative">⚙️</span></div><h3 style="font-family:'Onest',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0 0 9px">Что такое VPS</h3><p style="font-size:14.3px;color:#4E5F7C;margin:0;text-wrap:pretty">Виртуальный сервер это изолированная часть физического сервера с гарантированными ресурсами. Чаще всего используется виртуализация KVM: вы получаете полный root-доступ и ставите любое ПО, как на отдельной машине</p></div><div class="s10" data-h="h8"><div style="position:relative;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;background:linear-gradient(180deg,#22C173,#0B8F4F);border:1px solid #0B8F4F;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -8px rgba(18,183,106,.6)"><span class="s11"></span><span style="position:relative">✅</span></div><h3 class="s30">Что можно запустить</h3><div class="s40"><div class="s5"><span class="s18">→</span>Сайты, магазины, лендинги</div><div class="s5"><span class="s18">→</span>1С, Битрикс, CRM</div><div class="s5"><span class="s18">→</span>Telegram-ботов и сервисы</div><div class="s5"><span class="s18">→</span>Базы данных и бэкенды</div><div class="s5"><span class="s18">→</span>AI и ML инференс</div><div class="s5"><span class="s18">→</span>Игровые и тестовые серверы</div></div></div><div class="s10" data-h="h8"><div style="position:relative;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;background:linear-gradient(180deg,#DB3140,#A8121F);border:1px solid #A8121F;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -8px rgba(197,25,41,.55)"><span class="s11"></span><span style="position:relative">📌</span></div><h3 class="s30">Что учесть до заказа</h3><div class="s40"><div class="s5"><span class="s18">→</span>Ресурсы ограничены тарифом, под нагрузку берите запас</div><div class="s5"><span class="s18">→</span>География влияет на пинг и на закон о данных</div><div class="s5"><span class="s18">→</span>Проверьте способ оплаты: рубли, зарубежная карта, крипта</div><div class="s5"><span class="s18">→</span>Соблюдайте правила провайдера (AUP) и законодательство</div></div></div></div></section><section id="news" class="s37"><div class="s3">Редакция</div><h2 class="s16">Новости и обзоры</h2><p class="s27">Пишем только о том, что можем проверить по первоисточнику, и разбираем, что это значит для выбора сервера</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px"><sc-for list="{{ news }}" as="n"><a href="{{ n.url }}" target="_blank" rel="noopener" sc-camel-on-click="{{ n.track }}" style="display:flex;flex-direction:column;padding:24px;border-radius:24px;color:inherit;text-decoration:none;background:linear-gradient(180deg,#FFFFFF,#FBFCFE);border:1px solid #E4EAF2;box-shadow:inset 0 1px 0 #fff,0 18px 36px -22px rgba(3,35,95,.4);transition:.2s;cursor:pointer" data-h="h9"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px"><span style="font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#fff;padding:5px 11px;border-radius:9px;background:linear-gradient(180deg,#3D85FF,#0A47CC);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 12px -4px rgba(7,78,232,.55)">{{ n.tag }}</span><span style="font-size:12px;color:#8290A8">{{ n.date }}</span></div><h3 style="font-family:'Onest',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin:0 0 9px;text-wrap:pretty">{{ n.title }}</h3><p style="font-size:14px;color:#5E6F8E;margin:0;flex-grow:1;text-wrap:pretty">{{ n.text }}</p><div style="display:inline-flex;align-items:center;gap:7px;font-family:'Onest',sans-serif;font-size:13.5px;font-weight:700;color:#013CA4;margin-top:16px">Читать <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:7px;background:#E9F0FD;border:1px solid #D8E3F6;font-size:11px">→</span></div></a></sc-for></div><div style="text-align:center;margin-top:32px"><a href="/news" style="display:inline-flex;align-items:center;gap:9px;font-family:'Onest',sans-serif;font-weight:700;font-size:14.5px;color:#013CA4;padding:13px 24px;border-radius:13px;border:1px solid #D8E3F6;background:linear-gradient(180deg,#FFFFFF,#F2F6FD);box-shadow:inset 0 1px 0 #fff,0 6px 14px -8px rgba(3,35,95,.35)">Все новости <span>→</span></a></div></section><footer style="background:linear-gradient(180deg,#FFFFFF,#F7F9FC);border-top:1px solid #E4EAF2;padding:40px 0 32px;box-shadow:inset 0 1px 0 #fff"><div style="max-width:1180px;margin:0 auto;padding:0 24px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:22px;align-items:flex-start"><a href="#top" style="display:flex;align-items:center;gap:9px;font-family:'Onest',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.6px;color:#03235F"><span>Подбор</span><span style="color:#fff;padding:3px 10px;border-radius:11px;background:linear-gradient(180deg,#3D85FF,#0A47CC);border:1px solid #0B44B8;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)">VPS</span></a><div style="display:flex;gap:22px;flex-wrap:wrap"><a sc-camel-on-click="{{ openPrivacy }}" class="s43">Политика конфиденциальности</a><a sc-camel-on-click="{{ openCookie }}" class="s43">Использование cookie</a><a href="#how" style="font-size:14px">Как это работает</a><a href="#providers" style="font-size:14px">Провайдеры</a><a href="mailto:info@podborvps.ru" style="font-size:14px">info@podborvps.ru</a></div></div><p style="font-size:12.5px;color:#8290A8;margin:26px 0 0;padding-top:22px;border-top:1px solid #E9EDF4;line-height:1.65;text-wrap:pretty">ПодборVPS это информационно-справочный сервис для сравнения тарифов виртуальных серверов. Сайт не я {id:'selectel-multiaz',date:'24 июля 2026',tag:'Технологии',title:'Selectel запустил мультизональные кластеры баз данных',text:'Облачные базы данных теперь можно разнести по трём зонам доступности. Тема отказоустойчивости выходит в массовый сегмент.',url:'/news/selectel-multi-az-klastery-baz-dannyh'}
];
var CFG = { heroStyle:'split', show3d:true, showCookie:true, resultsCount:10, defaultTask:'' };
var state = { task:null, ram:2, cpu:1, geo:'any', pay:null, budget:0, results:null, cookieSeen:true, modal:null };
function goal(name, params){
try { if (typeof window.ym !== 'undefined') window.ym(111248718, 'reachGoal', name, params || {}); } catch(e){}
}
function addUtm(url, campaign){
var utm = 'utm_source=podborvps&utm_medium=referral&utm_campaign=' + (campaign || 'vps_landing');
var h = url.indexOf('#'), frag = '';
if (h >= 0){ frag = url.slice(h); url = url.slice(0, h); }
url += (url.indexOf('?') >= 0 ? '&' : '?') + utm;
return url + frag;
}
function score(p){
var s = 25, reasons = [];
if (state.task){ if (p.tasks.indexOf(state.task) >= 0){ s += 25; reasons.push('под задачу'); } else s -= 12; }
if (state.geo && state.geo !== 'any'){ if (p.geos.indexOf(state.geo) >= 0){ s += 22; reasons.push('нужная география'); } else s -= 26; }
else s += 6;
// шаг способа оплаты убран из калькулятора, фактор не применяется
if (p.maxRam >= state.ram) s += 8; else s -= 10;
if (state.budget){ if (p.priceRub <= state.budget){ s += 10; reasons.push('в бюджет'); } else s -= 10; }
// доводчик при равном соответствии: дешевле вход, выше место. Объективный, комиссия тут не участвует
s += Math.max(0, 6 - Math.round((p.priceRub || 600) / 110));
return { score: Math.max(6, Math.min(99, s)), reasons: reasons };
}
function logoStyles(color){
return {
bg:'linear-gradient(160deg, color-mix(in oklab, '+color+' 68%, #ffffff), '+color+' 72%, color-mix(in oklab, '+color+' 78%, #000000))',
sh:'inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.22), 0 10px 20px -8px '+color+'99'
};
}
function setState(patch){ for (var k in patch) state[k] = patch[k]; render(); }
function runCalc(){
var limit = CFG.resultsCount || 9;
// приоритетные партнёры: поднимаем наверх, но только если провайдер реально подходит.
// иначе калькулятор выдавал бы, например, российский хостинг на запрос про ОАЭ и терял доверие
var PRIORITY = ['timeweb', 'adminvps'];
var FIT = 50;
var ranked = PROVIDERS.map(function(p){ var r = score(p); return { p:p, score:r.score, reasons:r.reasons }; })
.sort(function(a, b){
var ap = PRIORITY.indexOf(a.p.id) >= 0 && a.score >= FIT ? PRIORITY.indexOf(a.p.id) : 99;
var bp = PRIORITY.indexOf(b.p.id) >= 0 && b.score >= FIT ? PRIORITY.indexOf(b.p.id) : 99;
if (ap !== bp) return ap - bp;
return b.score - a.score;
}).slice(0, limit);
setState({ results: ranked });
goal('calc_result', { task: state.task || 'none' });
setTimeout(function(){
var n = REFS.resRef;
if (n){ var y = n.getBoundingClientRect().top + window.pageYOffset - 90; window.scrollTo({ top:y, behavior:'smooth' }); }
}, 60);
}
var chipOn  = { bg:'linear-gradient(180deg,#4C90FF,#0B4AD4)', bd:'#4C90FF', fg:'#FFFFFF', sh:'inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.2),0 8px 18px -6px rgba(7,78,232,.8)', icBg:'rgba(255,255,255,.22)' };
var chipOff = { bg:'linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035))', bd:'rgba(255,255,255,.12)', fg:'rgba(216,231,255,.86)', sh:'inset 0 1px 0 rgba(255,255,255,.08)', icBg:'rgba(255,255,255,.07)' };
function mkChips(items, key, extra){
return items.map(function(it){
var on = String(state[key]) === String(it.id);
var c = on ? chipOn : chipOff;
return { id:it.id, name:it.name, ic:it.ic || '', bg:c.bg, bd:c.bd, fg:c.fg, sh:c.sh, icBg:c.icBg,
pick: function(){ var o = {}; o[key] = it.id; if (extra) extra(it, o); setState(o); } };
});
}
function buildVals(){
var providers = PROVIDERS.map(function(p){
var l = logoStyles(p.color);
var isTop = p.topPick === true; var isFeat = p.featured === true; var ft = isFeat || isTop;
return { name:p.name, geoLabel:p.geoLabel, desc:p.desc, tags:p.tags, price:p.price, letter:p.name.charAt(0),
badge: p.badge || '', featured: ft, promo: p.promo || '', promoCode: p.promoCode || '', promoCond: p.promoCond || '',
ribbonBg: isTop ? 'linear-gradient(180deg,#F6C750,#DE9526)' : 'linear-gradient(180deg,#3D85FF,#0A47CC)',
ribbonText: isTop ? ('★ Наш выбор' + (p.badge ? ' · ' + p.badge : '')) : ('★ ' + (p.badge || '')),
cardBg: isTop ? 'linear-gradient(180deg,#FFFFFF,#FFFBF0)' : isFeat ? 'linear-gradient(180deg,#FFFFFF,#F4F8FF)' : 'linear-gradient(180deg,#FFFFFF,#FBFCFE)',
cardBd: isTop ? '#EBB13C' : isFeat ? '#A9C6F8' : '#E4EAF2',
cardSh: isTop ? 'inset 0 1px 0 #fff,0 2px 6px rgba(214,150,30,.14),0 24px 48px -20px rgba(214,150,30,.5)' : isFeat ? 'inset 0 1px 0 #fff,0 2px 4px rgba(3,35,95,.06),0 22px 44px -20px rgba(7,78,232,.55)'
           : 'inset 0 1px 0 #fff,0 1px 2px rgba(3,35,95,.04),0 18px 36px -22px rgba(3,35,95,.4)',
link: addUtm(p.url, 'catalog'), logoBg:l.bg, logoSh:l.sh,
track: function(){ goal('provider_click', { provider:p.id, place:'catalog' }); goal('go_' + p.id); } };
});
var results = (state.results || []).map(function(r, i){
var p = r.p, top = (i < 3 && r.score >= 60), l = logoStyles(p.color);
return { rank:i+1, name:p.name, desc:p.desc, price:p.price, score:r.score, pct:r.score + '%',
letter:p.name.charAt(0), top:top, badge: p.badge || '', topPick: p.topPick === true, promo: p.promo || '', promoCode: p.promoCode || '', matchTags:r.reasons, tags:p.tags.slice(0, 2),
link: addUtm(p.url, 'calculator'), logoBg:l.bg, logoSh:l.sh,
cardBg: top ? 'linear-gradient(180deg,#FFFFFF,#F6F9FF)' : 'linear-gradient(180deg,#FFFFFF,#FBFCFE)',
cardBd: top ? '#A9C6F8' : '#E4EAF2',
cardSh: top ? 'inset 0 1px 0 #fff,0 2px 4px rgba(3,35,95,.06),0 26px 50px -24px rgba(7,78,232,.65)'
: 'inset 0 1px 0 #fff,0 1px 2px rgba(3,35,95,.04),0 18px 36px -22px rgba(3,35,95,.4)',
track: function(){ goal('provider_click', { provider:p.id, place:'calculator' }); goal('go_' + p.id); } };
});
var PROMOS = PROVIDERS.filter(function(p){ return p.promo; }).map(function(p){ var l = logoStyles(p.color); return { provider:p.name, letter:p.name.charAt(0), logoBg:l.bg, logoSh:l.sh, benefit:p.promo, code:p.promoCode||'', hasCode: !!p.promoCode, cond:p.promoCond||'', link: addUtm(p.url,'promo'), track: function(){ goal('provider_click',{provider:p.id,place:'promo'}); goal('go_'+p.id); goal('promo_click',{promo:p.id}); } }; });
var hero = CFG.heroStyle;
return {
heroSplit: hero === 'split', heroMinimal: hero === 'minimal', heroFused: hero === 'fused',
show3d: CFG.show3d !== false,
sceneRef:'sceneRef', resRef:'resRef',
tasks: mkChips(TASKS, 'task', function(it, o){ o.ram = it.ram; o.cpu = it.cpu; goal('calc_start', { task: it.id }); }),
ramChips: mkChips(RAMS.map(function(r){ return { id:r, name:r + ' ГБ' }; }), 'ram'),
cpuChips: mkChips(CPUS.map(function(r){ return { id:r, name:r + (r === 1 ? ' ядро' : ' ядра') }; }), 'cpu'),
geoChips: mkChips(GEOS, 'geo'),
payChips: mkChips(PAYS, 'pay'),
budgetChips: mkChips(BUDGETS, 'budget'),
providers: providers, promos: PROMOS, news: NEWS.map(function(n){ return { date:n.date, tag:n.tag, title:n.title, text:n.text, url:n.url,
track: function(){ goal('news_click', { news:n.id }); } }; }),
results: results, hasResults: results.length > 0,
runCalc: runCalc,
showCookieBar: (CFG.showCookie !== false) && !state.cookieSeen,
acceptCookie: function(){ try { localStorage.setItem('cookie_ok', '1'); } catch(e){} goal('cookie_accept'); setState({ cookieSeen:true }); },
modalOpen: !!state.modal, isPrivacy: state.modal === 'privacy', isCookie: state.modal === 'cookie',
openPrivacy: function(){ setState({ modal:'privacy' }); },
openCookie:  function(){ setState({ modal:'cookie' }); },
closeModal:  function(){ setState({ modal:null }); },
onBackdrop:  function(e){ if (e.target === e.currentTarget) setState({ modal:null }); }
};
}
var tplEl, rootEl;
function render(){
var y = window.pageYOffset;
mount(tplEl, buildVals(), rootEl);
window.scrollTo(0, y);
}
var target = { x:0, y:0 }, cur = { x:0, y:0 }, raf = null;
function tick(){
cur.x += (target.x - cur.x) * 0.07;
cur.y += (target.y - cur.y) * 0.07;
var n = document.querySelector('[data-scene]');
if (n) n.style.transform = 'rotateX(' + (56 - cur.y) + 'deg) rotateZ(' + (-42 + cur.x) + 'deg) scale(.5)';
raf = requestAnimationFrame(tick);
}
document.addEventListener('DOMContentLoaded', function(){
tplEl = document.getElementById('tpl');
rootEl = document.getElementById('root');
var dt = CFG.defaultTask;
if (dt){
var t = TASKS.filter(function(x){ return x.id === dt; })[0];
if (t){ state.task = t.id; state.ram = t.ram; state.cpu = t.cpu; }
}
render();
var seen = true;
try { seen = localStorage.getItem('cookie_ok') === '1'; } catch(e){ seen = false; }
if (!seen) setTimeout(function(){ setState({ cookieSeen:false }); }, 700);
window.addEventListener('mousemove', function(e){
var w = window.innerWidth || 1, h = window.innerHeight || 1;
target.x = ((e.clientX / w) - .5) * 10;
target.y = ((e.clientY / h) - .5) * 8;
}, { passive:true });
raf = requestAnimationFrame(tick);
window.addEventListener('keydown', function(e){ if (e.key === 'Escape' && state.modal) setState({ modal:null }); });
document.addEventListener('click', function(e){
if (state.cookieSeen) return;
if (e.target.closest && e.target.closest('[data-cookie]')) return;
setTimeout(function(){
if (state.cookieSeen) return;
try { localStorage.setItem('cookie_ok', '1'); } catch(err){}
goal('cookie_accept');
setState({ cookieSeen: true });
}, 0);
});
});
</script>
</body>
</html>
